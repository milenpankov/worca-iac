# Let's Encrypt over HTTP-01 through Traefik. `letsencrypt-staging` for experiments: its rate
# limits are generous, its certificates are not trusted by browsers.
{{- range $name, $server := dict "letsencrypt" "https://acme-v02.api.letsencrypt.org/directory" "letsencrypt-staging" "https://acme-staging-v02.api.letsencrypt.org/directory" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $server }}
    email: {{ required "acmeEmail" $.Values.acmeEmail | quote }}
    privateKeySecretRef:
      name: {{ $name }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- end }}
