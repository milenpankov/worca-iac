# SSM Parameter Store as a secret source. No credentials here: External Secrets' service account
# has an EKS Pod Identity role that may read <ssmPrefix>/* and nothing else (infra/iam.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "region" .Values.region | quote }}
{{- range $secret, $spec := .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ $spec.namespace | default $.Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    {{- with $spec.labels }}
    template:
      metadata:
        labels:
          {{- toYaml . | nindent 10 }}
    {{- end }}
  data:
    {{- range $key, $param := $spec.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.ssmPrefix $param }}
    {{- end }}
{{- end }}
