# Azure Key Vault as a secret source (worca-iac/secrets/azure-keyvault). No credentials here: the
# External Secrets service account is federated with a managed identity that may read the vault's
# secrets and nothing else (infra/identities.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "keyVault.url" .Values.keyVault.url | quote }}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
{{- range $secret, $spec := .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ $spec.namespace | default $.Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    {{- with $spec.labels }}
    template:
      metadata:
        labels:
          {{- toYaml . | nindent 10 }}
    {{- end }}
  data:
    {{- range $key, $name := $spec.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $name }}
    {{- end }}
{{- end }}
